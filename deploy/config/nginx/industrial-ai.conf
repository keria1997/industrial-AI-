# nginx 站点配置 - 工业AI平台
# 安装位置：/etc/nginx/sites-available/industrial-ai.conf
# 启用：ln -s /etc/nginx/sites-available/industrial-ai.conf /etc/nginx/sites-enabled/
#
# 前端静态文件由 nginx 直接服务；/api/v1 反向代理到本机 Java 后端 (5185)

# 上游 Java API
upstream industrial_ai_api {
    server 127.0.0.1:5185;
    keepalive 32;
}

# 请求体大小限制（导入导出、批量操作可能较大）
client_max_body_size 25m;

# 后端响应超时（MRP/APS 任务、导出可能耗时）
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 如需 HTTPS，使用 certbot 注销本段并替换为 443 配置：
    #   sudo certbot --nginx -d your.domain.com

    # 安全响应头
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # 前端静态产物
    root /opt/industrial-ai/current/app/dist;
    index index.html;

    # 静态资源（Vite 构建产物带 hash，可强缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # logo 与其他静态资源
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API 反向代理
    location /api/v1/ {
        proxy_pass         http://industrial_ai_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # 后端写操作需要 Idempotency-Key、If-Match、X-Tenant-Id 等，header 默认透传
    }

    # Java 后端健康检查
    location = /healthz {
        access_log off;
        proxy_pass http://industrial_ai_api;
    }

    # SPA 路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
