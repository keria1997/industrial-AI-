openapi: 3.1.0
info:
  title: 工业 AI 平台生产与首期履约 API
  version: 1.7.0
  description: |
    工业 AI 平台 V2.1.0 当前已实现的签名会话、生产管理 P0、销售—库存—生产—发货首期履约，
    以及 MRP 缺料到采购申请、采购订单、采购入库和物料齐套的 Reference 闭环 HTTP 契约。
    数量字段统一使用 decimal(18,6) 字符串。除 readiness 和查询类接口外，
    业务请求使用 Bearer Token，并在 X-Tenant-Id 中选择会话已授权租户；
    写操作必须携带 X-Idempotency-Key；修改已有聚合时建议携带 If-Match。
  contact:
    name: 工业 AI 平台研发组
  x-implementation-status: implemented-production-p0-reference-planning-and-fulfillment-baseline
servers:
  - url: /api/v1/production
    description: 当前来源的同源代理地址
  - url: http://127.0.0.1:5185/api/v1/production
    description: 本地生产 API 服务
security:
  - BearerAuth: []
    TenantContext: []
tags:
  - { name: Session }
  - { name: Readiness }
  - { name: Demand }
  - { name: SalesProductionLink }
  - { name: WorkOrder }
  - { name: Quality }
  - { name: Completion }
  - { name: Close }
  - { name: Planning }
  - { name: Task }
  - { name: Dashboard }
  - { name: SalesOrder }
  - { name: SalesReview }
  - { name: ShipmentRequest }
  - { name: FulfillmentTrace }
  - { name: InventoryAvailability }
  - { name: InventoryShipmentTask }
  - { name: InventoryReservation }
  - { name: SalesOutbound }
  - { name: InventoryTransaction }
  - { name: Procurement }
  - { name: InternalEvent }
paths:
  /session/login:
    servers:
      - { url: /api/v1, description: 当前来源的同源代理地址 }
      - { url: 'http://127.0.0.1:5185/api/v1', description: 本地会话服务 }
    post:
      tags: [Session]
      summary: 使用开发账号取得签名访问令牌
      description: 仅在非生产环境且 DEMO_AUTH_ENABLED 未关闭时可用；生产环境必须接入受信任身份提供方。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionLoginInput' }
      responses:
        '200': { description: 登录成功, content: { application/json: { schema: { $ref: '#/components/schemas/SessionLoginResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /session/me:
    servers:
      - { url: /api/v1, description: 当前来源的同源代理地址 }
      - { url: 'http://127.0.0.1:5185/api/v1', description: 本地会话服务 }
    get:
      tags: [Session]
      summary: 校验当前签名会话和所选租户
      security:
        - BearerAuth: []
      parameters:
        - { name: X-Tenant-Id, in: header, required: false, schema: { type: string }, description: 要校验的租户；省略时使用令牌中的第一个授权租户 }
      responses:
        '200': { description: 当前会话摘要, content: { application/json: { schema: { $ref: '#/components/schemas/SessionMe' } } } }
        default: { $ref: '#/components/responses/Error' }
  /readiness:
    get:
      tags: [Readiness]
      summary: 生产服务与租户能力就绪检查
      responses: { '200': { description: 就绪结果 } }
  /demands:
    get:
      tags: [Demand]
      summary: 分页查询需求
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/FactoryResourceId' }, { $ref: '#/components/parameters/Search' } ]
      responses: { '200': { description: 需求分页 } }
    post:
      tags: [Demand]
      summary: 创建生产需求
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDemand' }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Demand' } } } }
        default: { $ref: '#/components/responses/Error' }
  /internal/inventory-availability-events:
    post:
      tags: [SalesProductionLink]
      summary: 消费库存可用量事件并通过 Inbox 更新库存事实投影
      description: 同一 eventId 只消费一次；较旧 factVersion 会记录为已处理但不会覆盖较新事实。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryAvailabilityEvent' }
      responses:
        '200': { description: Inbox 消费与投影更新结果 }
        default: { $ref: '#/components/responses/Error' }
  /sales-order-intakes:
    post:
      tags: [SalesProductionLink]
      summary: 仓库按库存事实接入销售订单，缺货时事务化创建生产需求
      description: 目标业务触发为待确认订单完成所需复核/审批、销售发起发货并移交仓库后，由仓库在库存校验发现缺货时调用。当前接口只负责重新读取库存事实和创建生产侧接入事实，不持有销售订单聚合，无法独立校验销售确认/审批状态。接入记录、生产需求、来源关系、状态历史、审计、Outbox 和幂等结果在同一事务中提交。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderIntakeInput' }
      responses:
        '200': { description: 已按业务键恢复既有接入结果, content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderIntakeResult' } } } }
        '201': { description: 库存校验和订单接入已完成, content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderIntakeResult' } } } }
        '424': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /sales-order-intakes/{salesOrderId}:
    get:
      tags: [SalesProductionLink]
      summary: 按销售订单行和来源版本恢复接入记录
      parameters:
        - { name: salesOrderId, in: path, required: true, schema: { type: string, maxLength: 100 } }
        - { name: sourceLineId, in: query, required: false, schema: { type: string, default: '1' } }
        - { name: sourceRevision, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 销售订单接入记录, content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderIntake' } } } }
        default: { $ref: '#/components/responses/Error' }
  /demands/{id}/validate:
    post:
      tags: [Demand]
      summary: 校验产品、工厂、BOM 和工艺，输出阻断原因
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DemandValidationInput' } } } }
      responses: { '200': { description: 校验后需求 }, default: { $ref: '#/components/responses/Error' } }
  /demands/{id}/approve:
    post:
      tags: [Demand]
      summary: 审批需求；制单人与审批人分离
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RemarkInput' } } } }
      responses: { '200': { description: 已审批 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders:
    get:
      tags: [WorkOrder]
      summary: 分页查询工单
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/FactoryResourceId' }, { $ref: '#/components/parameters/Search' } ]
      responses: { '200': { description: 工单分页 } }
    post:
      tags: [WorkOrder]
      summary: 创建 DRAFT/PLANNED 工单并保存需求 pegging
      description: 带需求关联的工单必须存在覆盖需求的成功 APS 候选；服务端按最新物料库存重新计算齐套状态，调用方传入的 kittingStatus 不能绕过缺料校验。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkOrder' } } } }
      responses: { '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrder' } } } }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}:
    get:
      tags: [WorkOrder]
      summary: 获取工单详情和 ETag
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: 工单详情 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/release-impact:
    post:
      tags: [WorkOrder]
      summary: 下达影响预览，不改变状态
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: 阻断项与修复动作 } }
  /work-orders/{id}/release:
    post:
      tags: [WorkOrder]
      summary: 校验 BOM/工艺快照、APS、齐套后下达
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderCommandInput' } } } }
      responses: { '200': { description: 已下达 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/start:
    post:
      tags: [WorkOrder]
      summary: 开工
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderCommandInput' } } } }
      responses: { '200': { description: 已开工 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/pause:
    post:
      tags: [WorkOrder]
      summary: 暂停，原因必填
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PauseWorkOrderInput' } } } }
      responses: { '200': { description: 已暂停 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/resume:
    post:
      tags: [WorkOrder]
      summary: 恢复生产
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderCommandInput' } } } }
      responses: { '200': { description: 已恢复 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/reports:
    post:
      tags: [WorkOrder]
      summary: 原子提交报工并校验数量守恒
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkReportInput' } } } }
      responses: { '201': { description: 已过账报工 }, default: { $ref: '#/components/responses/Error' } }
  /work-reports/{id}/corrections:
    post:
      tags: [WorkOrder]
      summary: 保留原记录并生成更正记录
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportCorrectionInput' } } } }
      responses: { '201': { description: 已更正 }, default: { $ref: '#/components/responses/Error' } }
  /inspections:
    get:
      tags: [Quality]
      summary: 查询 FQC
      parameters: [ { $ref: '#/components/parameters/WorkOrderIdQuery' } ]
      responses: { '200': { description: 检验列表 } }
    post:
      tags: [Quality]
      summary: 创建 FQC 或返工复检
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InspectionInput' } } } }
      responses: { '201': { description: 已创建 }, default: { $ref: '#/components/responses/Error' } }
  /inspections/{id}/result:
    post:
      tags: [Quality]
      summary: 提交 FQC 结果；失败进入 DISPOSITION_PENDING
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InspectionResultInput' } } } }
      responses: { '200': { description: 检验结果 }, default: { $ref: '#/components/responses/Error' } }
  /inspections/{id}/rework:
    post:
      tags: [Quality]
      summary: 创建返工事实
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DispositionInput' } } } }
      responses: { '201': { description: 返工单 }, default: { $ref: '#/components/responses/Error' } }
  /inspections/{id}/scrap:
    post:
      tags: [Quality]
      summary: 质量主管审批报废；与检验人分离
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DispositionInput' } } } }
      responses: { '200': { description: 已报废 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/completion-allocation-preview:
    post:
      tags: [Completion]
      summary: 按强 pegging 和确定性优先级预览销售分配
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AllocationPreviewInput' } } } }
      responses: { '200': { description: 分配预览 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/completions:
    post:
      tags: [Completion]
      summary: 提交成品入库，返回 POSTING 异步任务
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionInput' } } } }
      responses:
        '202': { description: 已受理, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionAccepted' } } } }
        default: { $ref: '#/components/responses/Error' }
  /completions/{id}:
    get:
      tags: [Completion]
      summary: 查询完工、库存结果和销售分配
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: 完工详情 }, default: { $ref: '#/components/responses/Error' } }
  /completions/{id}/retry:
    post:
      tags: [Completion]
      summary: 修复库存拒绝后复用原业务幂等关系重试
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CompletionRetryInput' } } } }
      responses: { '202': { description: 已重新提交 }, default: { $ref: '#/components/responses/Error' } }
  /internal/completions/{id}/inventory-result:
    post:
      tags: [Completion]
      summary: 库存确认、明确拒绝或结果未知回调
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryResultInput' }
      responses: { '200': { description: 已处理 }, '202': { description: 结果未知，继续查询原任务 }, default: { $ref: '#/components/responses/Error' } }
  /work-orders/{id}/close-check:
    post:
      tags: [Close]
      summary: 检查 FQC、投退料、完工任务和入库事实
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: 结案检查 } }
  /work-orders/{id}/close-submit:
    post:
      tags: [Close]
      summary: 提交结案复核
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CloseSubmitInput' } } } }
      responses: { '201': { description: 待复核 }, default: { $ref: '#/components/responses/Error' } }
  /work-order-closes/{id}/approve:
    post:
      tags: [Close]
      summary: 不同账号复核并关闭工单
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RemarkInput' } } } }
      responses: { '200': { description: 工单已关闭 }, default: { $ref: '#/components/responses/Error' } }
  /mrp-runs:
    post:
      tags: [Planning]
      summary: 对指定已审批需求执行 Reference MPS/MRP
      description: REFERENCE_MPS_MRP_V2 在事务内固化 MPS/MRP 结果并把需求推进为 PLANNED；按 Reference BOM 和 WH-RM-01 权威物料库存计算 materialShortages。存在缺料时 canProceedToAps=false，必须采购入库并同步新版库存事实后才能运行 APS。任务返回 SUCCEEDED 不代表客户正式求解器已联调。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PlanningRunInput' } } } }
      responses: { '202': { description: Reference 任务结果已持久化, content: { application/json: { schema: { $ref: '#/components/schemas/PlanningTaskAccepted' } } } }, default: { $ref: '#/components/responses/Error' } }
  /schedule-runs:
    post:
      tags: [Planning]
      summary: 对指定已计划需求执行 Reference APS
      description: 返回已发布的排程候选；带需求关联的工单必须引用覆盖对应 demandIds 的成功候选。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PlanningRunInput' } } } }
      responses: { '202': { description: Reference 排程结果已持久化, content: { application/json: { schema: { $ref: '#/components/schemas/PlanningTaskAccepted' } } } }, default: { $ref: '#/components/responses/Error' } }
  /tasks/{id}:
    get:
      tags: [Task]
      summary: 查询长任务状态
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: 任务状态 }, default: { $ref: '#/components/responses/Error' } }
  /dashboard/kpis:
    get:
      tags: [Dashboard]
      summary: 按租户和数据范围返回真实 KPI
      responses: { '200': { description: KPI、风险和更新时间 } }
  /sales/sales-orders:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /sales/sales-orders/{id}:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders~1{id}'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /sales/sales-orders/{id}/review-submit:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders~1{id}~1review-submit'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /sales/sales-orders/{id}/review-decisions:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders~1{id}~1review-decisions'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /sales/sales-orders/{id}/confirm:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders~1{id}~1confirm'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /sales/sales-orders/{id}/shipment-requests:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders~1{id}~1shipment-requests'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /sales/sales-orders/{id}/fulfillment-trace:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders~1{id}~1fulfillment-trace'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /sales/sales-orders/{id}/cancel:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1sales~1sales-orders~1{id}~1cancel'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/availability:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1availability'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/internal/availability-events:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1internal~1availability-events'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/shipment-tasks:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1shipment-tasks'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/shipment-tasks/{id}:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1shipment-tasks~1{id}'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/shipment-tasks/{id}/check-and-reserve:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1shipment-tasks~1{id}~1check-and-reserve'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/shipment-tasks/{id}/production-requests:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1shipment-tasks~1{id}~1production-requests'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/reservations/{id}:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1reservations~1{id}'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/reservations/{id}/release:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1reservations~1{id}~1release'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/outbounds/{id}:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1outbounds~1{id}'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/outbounds/{id}/post:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1outbounds~1{id}~1post'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /inventory/transactions:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1transactions'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
  /procurement/purchase-requests:
    servers: [ { url: /api/v1, description: 履约采购 Reference API } ]
    get:
      tags: [Procurement]
      summary: 查询当前租户的采购申请
      responses:
        '200': { description: 采购申请列表, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequestList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Procurement]
      summary: 从 MRP 缺料行创建采购申请
      description: 服务端校验 MRP 任务已成功且目标 demandId/materialId 仍有正数缺口；同一 MRP 缺料行只能生成一张采购申请。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePurchaseRequestInput' } } } }
      responses:
        '200': { description: 返回同一 MRP 缺料行的既有采购申请, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequest' } } } }
        '201': { description: 采购申请已创建, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequest' } } } }
        default: { $ref: '#/components/responses/Error' }
  /procurement/purchase-requests/{id}/approve:
    servers: [ { url: /api/v1, description: 履约采购 Reference API } ]
    post:
      tags: [Procurement]
      summary: 审批采购申请并生成采购订单
      description: 采购申请制单人与审批人必须分离；审批和采购订单创建在同一事务中提交。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovePurchaseRequestInput' } } } }
      responses:
        '201': { description: 审批通过并生成采购订单, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequestApprovalResult' } } } }
        default: { $ref: '#/components/responses/Error' }
  /procurement/purchase-orders:
    servers: [ { url: /api/v1, description: 履约采购 Reference API } ]
    get:
      tags: [Procurement]
      summary: 查询当前租户的采购订单
      responses:
        '200': { description: 采购订单列表, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseOrderList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /procurement/purchase-orders/{id}/receipts:
    servers: [ { url: /api/v1, description: 履约采购 Reference API } ]
    post:
      tags: [Procurement]
      summary: 对采购订单执行全量收货入库
      description: Reference 基线按采购订单全量收货；同一事务创建收货单、采购入库库存流水和新版物料可用量事实，并同步生产库存投影以解除齐套阻断。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseReceiptInput' } } } }
      responses:
        '200': { description: 返回已存在的幂等收货结果, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseReceiptResult' } } } }
        '201': { description: 采购入库已过账, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseReceiptResult' } } } }
        default: { $ref: '#/components/responses/Error' }
  /procurement/purchase-receipts:
    servers: [ { url: /api/v1, description: 履约采购 Reference API } ]
    get:
      tags: [Procurement]
      summary: 查询当前租户的采购入库单
      responses:
        '200': { description: 采购入库单列表, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseReceiptList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /inventory/internal/completion-results:
    $ref: './openapi-sales-inventory-draft.yaml#/paths/~1inventory~1internal~1completion-results'
    servers: [ { url: /api/v1, description: 首期履约 API } ]
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 由会话或受信任身份服务签发的短期访问令牌；服务端从签名声明读取账号、权限和可访问租户。
    TenantContext:
      type: apiKey
      in: header
      name: X-Tenant-Id
      description: 当前选择的租户 ID，必须包含在访问令牌的 tenantIds 中。
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: X-Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string }, description: 查询响应中的 ETag/row version }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
    Status: { name: status, in: query, schema: { type: string } }
    FactoryResourceId: { name: factoryResourceId, in: query, schema: { type: string, maxLength: 100 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
    WorkOrderIdQuery: { name: workOrderId, in: query, schema: { type: string, format: uuid } }
    TraceId: { name: X-Trace-Id, in: header, required: false, schema: { type: string }, description: 调用方提供的链路追踪 ID；缺省时由服务生成 }
    ProductionCapability: { name: X-Production-Capability, in: header, required: false, schema: { type: string, enum: [enabled, disabled, unavailable] }, description: 网关的租户生产能力校验结果 }
  responses:
    Error:
      description: 统一业务错误
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    SessionLoginInput:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200, format: password }
    SessionUser:
      type: object
      required: [account, name, role, tenantIds, permissions, permissionVersion]
      properties:
        account: { type: string }
        name: { type: string }
        role: { type: string }
        tenantIds: { type: array, minItems: 1, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        permissionVersion: { type: string }
    SessionLoginResponse:
      type: object
      required: [accessToken, expiresAt, tokenType, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        tokenType: { type: string, const: Bearer }
        user: { $ref: '#/components/schemas/SessionUser' }
    SessionMe:
      type: object
      required: [account, tenantId, permissions, permissionVersion]
      properties:
        account: { type: string }
        tenantId: { type: string }
        permissions: { type: array, items: { type: string } }
        permissionVersion: { type: string }
    Decimal: { type: string, pattern: '^(0|[1-9]\d*)(\.\d{1,6})?$' }
    PositiveDecimal: { type: string, pattern: '^(?!0(?:\.0{1,6})?$)(?:0|[1-9]\d*)(?:\.\d{1,6})?$' }
    InventoryAvailabilityEvent:
      type: object
      additionalProperties: false
      required: [eventId, productId, inventoryWarehouseId, availableQty, uom, factVersion, sourceSystem, asOf]
      properties:
        eventId: { type: string, maxLength: 100 }
        eventVersion: { type: integer, minimum: 1, default: 1 }
        productId: { type: string, maxLength: 100 }
        inventoryWarehouseId: { type: string, maxLength: 100 }
        availableQty: { $ref: '#/components/schemas/Decimal' }
        uom: { type: string, maxLength: 20 }
        factVersion: { type: integer, minimum: 1 }
        sourceSystem: { type: string, maxLength: 50 }
        asOf: { type: string, format: date-time }
    InventoryAvailability:
      type: object
      required: [tenantId, productId, inventoryWarehouseId, availableQty, uom, factVersion, sourceEventId, sourceSystem, asOf]
      properties:
        tenantId: { type: string }
        productId: { type: string }
        inventoryWarehouseId: { type: string }
        availableQty: { $ref: '#/components/schemas/Decimal' }
        uom: { type: string }
        factVersion: { type: integer }
        sourceEventId: { type: string }
        sourceSystem: { type: string }
        asOf: { type: string, format: date-time }
    SalesOrderIntakeInput:
      type: object
      additionalProperties: false
      required: [salesOrderId, productId, orderedQty, uom, dueDate, factoryResourceId, inventoryWarehouseId]
      properties:
        salesOrderId: { type: string, maxLength: 100 }
        sourceLineId: { type: string, maxLength: 100, default: '1' }
        sourceRevision: { type: integer, minimum: 1, default: 1 }
        productId: { type: string, maxLength: 100 }
        productName: { type: string, maxLength: 200 }
        orderedQty: { $ref: '#/components/schemas/PositiveDecimal', description: 当前兼容字段，表示本次发货申请行数量而非订单生命周期累计订购量；正式销售/库存契约待拆分为 requestedQty 等明确字段 }
        uom: { type: string, maxLength: 20 }
        dueDate: { type: string, format: date }
        factoryResourceId: { type: string, maxLength: 100 }
        inventoryWarehouseId: { type: string, maxLength: 100 }
        priority: { type: integer, minimum: 1, maximum: 100 }
        correlationId: { type: string, maxLength: 100 }
    SalesOrderIntake:
      type: object
      required: [id, tenantId, salesOrderId, sourceLineId, sourceRevision, productId, orderedQty, availableQty, shortageQty, uom, dueDate, factoryResourceId, inventoryWarehouseId, inventoryFactVersion, decision, status, correlationId, traceId, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        salesOrderId: { type: string }
        sourceLineId: { type: string }
        sourceRevision: { type: integer }
        productId: { type: string }
        productName: { type: string }
        orderedQty: { $ref: '#/components/schemas/PositiveDecimal', description: 本次接入计算使用的申请数量 }
        availableQty: { $ref: '#/components/schemas/Decimal' }
        shortageQty: { $ref: '#/components/schemas/Decimal' }
        uom: { type: string }
        dueDate: { type: string, format: date }
        factoryResourceId: { type: string }
        inventoryWarehouseId: { type: string }
        inventoryFactVersion: { type: integer }
        decision: { type: string, enum: [FULFILL_FROM_STOCK, CREATE_PRODUCTION_DEMAND] }
        demandId: { type: string, format: uuid }
        status: { type: string, enum: [COMPLETED] }
        correlationId: { type: string }
        traceId: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    SalesOrderIntakeResult:
      type: object
      required: [intake, recovered]
      properties:
        intake: { $ref: '#/components/schemas/SalesOrderIntake' }
        availability: { $ref: '#/components/schemas/InventoryAvailability' }
        demand: { $ref: '#/components/schemas/Demand' }
        recovered: { type: boolean }
    CreateDemand:
      type: object
      required: [sourceType, productId, qty, uom, dueDate, factoryResourceId]
      properties:
        code: { type: string, maxLength: 50 }
        sourceType: { type: string }
        sourceSystem: { type: string, maxLength: 30 }
        sourceId: { type: string }
        sourceLineId: { type: string, maxLength: 100 }
        sourceRevision: { type: integer, minimum: 1 }
        productId: { type: string }
        productName: { type: string }
        qty: { $ref: '#/components/schemas/PositiveDecimal' }
        uom: { type: string }
        dueDate: { type: string, format: date }
        priority: { type: integer, minimum: 1, maximum: 100 }
        factoryResourceId: { type: string }
        correlationId: { type: string, maxLength: 100 }
        payloadSnapshot: { type: object, additionalProperties: true }
    DemandValidationInput:
      type: object
      additionalProperties: false
      properties:
        productActive: { type: boolean }
        factoryActive: { type: boolean }
        bomEffective: { type: boolean }
        routingEffective: { type: boolean }
    RemarkInput:
      type: object
      additionalProperties: false
      properties:
        remark: { type: string, maxLength: 500 }
    Demand:
      allOf:
        - { $ref: '#/components/schemas/CreateDemand' }
        - type: object
          required: [id, code, status, version]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            status: { type: string, enum: [RECEIVED, VALIDATING, PENDING_REVIEW, APPROVED, PLANNED, FULFILLED, BLOCKED, REJECTED, CANCELLED, MERGED] }
            version: { type: integer }
            blockReasons: { type: array, items: { type: string } }
            source: { $ref: '#/components/schemas/DemandTraceability' }
    DemandTraceability:
      type: object
      required: [sourceSystem, sourceType, correlationId]
      properties:
        sourceSystem: { type: string }
        sourceType: { type: string }
        salesOrderId: { type: string, format: uuid }
        salesOrderLineId: { type: string, format: uuid }
        shipmentRequestId: { type: string, format: uuid }
        shipmentRequestLineId: { type: string, format: uuid }
        inventoryWarehouseId: { type: string }
        inventoryFactVersion: { type: integer, minimum: 1 }
        correlationId: { type: string, format: uuid }
        traceId: { type: string }
    CreateWorkOrder:
      type: object
      required: [productId, factoryResourceId, workCenterResourceId, plannedQty, uom, dueDate]
      properties:
        code: { type: string, maxLength: 50 }
        productId: { type: string }
        productName: { type: string, maxLength: 200 }
        factoryResourceId: { type: string }
        workshopResourceId: { type: string, maxLength: 100 }
        lineResourceId: { type: string, maxLength: 100 }
        workCenterResourceId: { type: string }
        plannedQty: { $ref: '#/components/schemas/PositiveDecimal' }
        inputQty: { $ref: '#/components/schemas/Decimal' }
        uom: { type: string }
        dueDate: { type: string, format: date }
        bomSnapshotId: { type: string, format: uuid }
        routingSnapshotId: { type: string, format: uuid }
        scheduleCandidateId: { type: string, format: uuid }
        kittingCheckId: { type: string, format: uuid }
        kittingStatus: { type: string, enum: [READY, PARTIAL_READY, SHORTAGE, EXPIRED] }
        assigneeEmployeeId: { type: string, maxLength: 100 }
        correlationId: { type: string, maxLength: 100 }
        demandLinks: { type: array, maxItems: 100, items: { type: object, required: [demandId, allocatedQty], properties: { demandId: { type: string, format: uuid }, allocatedQty: { $ref: '#/components/schemas/PositiveDecimal' }, priorityRank: { type: integer, minimum: 1 }, customerLocked: { type: boolean }, promisedDate: { type: string, format: date } } } }
    WorkOrder:
      allOf:
        - { $ref: '#/components/schemas/CreateWorkOrder' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            status: { type: string, enum: [DRAFT, PLANNED, SCHEDULED, KITTING, RELEASED, IN_PROGRESS, PAUSED, COMPLETED, CLOSING, CLOSED, CANCELLING, CANCELLED] }
            reportedGoodQty: { $ref: '#/components/schemas/Decimal' }
            reportedDefectQty: { $ref: '#/components/schemas/Decimal' }
            reportedScrapQty: { $ref: '#/components/schemas/Decimal' }
            postedQty: { $ref: '#/components/schemas/Decimal' }
            parameterSnapshot:
              type: object
              properties:
                inventoryWarehouseId: { type: string, description: 从生产需求来源固化的目标库存仓库 }
                demandIds: { type: array, items: { type: string, format: uuid } }
            version: { type: integer }
    WorkOrderCommandInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    PauseWorkOrderInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    WorkReportInput:
      type: object
      additionalProperties: false
      required: [goodQty, uom]
      properties:
        operationId: { type: string, format: uuid }
        goodQty: { $ref: '#/components/schemas/Decimal' }
        defectQty: { $ref: '#/components/schemas/Decimal' }
        scrapQty: { $ref: '#/components/schemas/Decimal' }
        inputQty: { $ref: '#/components/schemas/Decimal' }
        uom: { type: string }
        source: { type: string, maxLength: 30 }
        remark: { type: string, maxLength: 500 }
    ReportCorrectionInput:
      type: object
      additionalProperties: false
      required: [goodQty, reasonCode, reason]
      properties:
        goodQty: { $ref: '#/components/schemas/Decimal' }
        defectQty: { $ref: '#/components/schemas/Decimal' }
        scrapQty: { $ref: '#/components/schemas/Decimal' }
        inputQty: { $ref: '#/components/schemas/Decimal' }
        reasonCode: { type: string, minLength: 1, maxLength: 50 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    InspectionInput:
      type: object
      additionalProperties: false
      required: [workOrderId, sampleQty]
      properties:
        workOrderId: { type: string, format: uuid }
        sampleQty: { $ref: '#/components/schemas/PositiveDecimal' }
        parentInspectionId: { type: string, format: uuid }
    InspectionResultInput:
      type: object
      additionalProperties: false
      required: [passedQty]
      properties:
        passedQty: { $ref: '#/components/schemas/Decimal' }
        failedQty: { $ref: '#/components/schemas/Decimal' }
        reason: { type: string, maxLength: 500 }
    DispositionInput:
      type: object
      additionalProperties: false
      required: [qty, reason]
      properties:
        qty: { $ref: '#/components/schemas/PositiveDecimal' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AllocationPreviewInput:
      type: object
      additionalProperties: false
      required: [qty]
      properties:
        qty: { $ref: '#/components/schemas/PositiveDecimal' }
    CompletionInput:
      type: object
      additionalProperties: false
      required: [inspectionId, qty, uom, warehouseResourceId, inventoryWarehouseId, traceMode, productionDate, allocationRevision]
      properties:
        inspectionId: { type: string, format: uuid }
        qty: { $ref: '#/components/schemas/PositiveDecimal' }
        uom: { type: string }
        warehouseResourceId: { type: string, description: 平台管理仓库资源 ID }
        inventoryWarehouseId: { type: string, description: 库存系统仓库 ID }
        binId: { type: string }
        traceMode: { type: string, enum: [NONE, BATCH, SERIAL] }
        batchNo: { type: string }
        serialNumbers: { type: array, items: { type: string }, uniqueItems: true }
        productionDate: { type: string, format: date }
        allocationRevision: { type: integer, minimum: 1 }
        remark: { type: string, maxLength: 500 }
    CompletionRetryInput:
      type: object
      additionalProperties: false
      properties:
        binId: { type: string, maxLength: 100 }
        batchNo: { type: string, maxLength: 100 }
        remark: { type: string, maxLength: 500 }
    InventoryResultInput:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: string, enum: [POSTED, REJECTED, UNKNOWN] }
        externalTransactionId: { type: string, maxLength: 100, description: result=POSTED 时必填 }
        failureCode: { type: string, maxLength: 100 }
        failureMessage: { type: string, maxLength: 500 }
    CloseSubmitInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
        varianceSnapshot: { type: object, additionalProperties: true }
    PlanningRunInput:
      type: object
      additionalProperties: true
      required: [demandIds]
      properties:
        demandIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
      description: MRP 只接受 APPROVED 需求并推进为 PLANNED；APS 只接受 PLANNED 需求。
    PlanningTaskAccepted:
      type: object
      required: [taskId, status, progress, result, traceId]
      properties:
        taskId: { type: string, format: uuid }
        status: { const: SUCCEEDED }
        progress: { const: 100 }
        result: { type: object, additionalProperties: true, description: MRP 返回 solverVersion=REFERENCE_MPS_MRP_V2、mpsLines、materialShortages 和 canProceedToAps；APS 返回 scheduleCandidates。 }
        traceId: { type: string }
    CreatePurchaseRequestInput:
      type: object
      additionalProperties: false
      required: [mrpTaskId, demandId, materialId]
      properties:
        mrpTaskId: { type: string, format: uuid }
        demandId: { type: string, format: uuid }
        materialId: { type: string, minLength: 1, maxLength: 100 }
    ApprovePurchaseRequestInput:
      type: object
      additionalProperties: false
      required: [supplierId, supplierName, promisedDate]
      properties:
        supplierId: { type: string, minLength: 1, maxLength: 100 }
        supplierName: { type: string, minLength: 1, maxLength: 200 }
        promisedDate: { type: string, format: date }
    PurchaseReceiptInput:
      type: object
      additionalProperties: false
      required: [externalTransactionId, receivedAt]
      properties:
        externalTransactionId: { type: string, minLength: 1, maxLength: 100 }
        receivedAt: { type: string, format: date-time }
    PurchaseRequest:
      type: object
      required: [id, tenantId, requestNo, mrpTaskId, demandId, materialId, warehouseId, requiredQty, uom, requiredDate, status, correlationId, createdBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        requestNo: { type: string }
        mrpTaskId: { type: string, format: uuid }
        demandId: { type: string, format: uuid }
        materialId: { type: string }
        materialName: { type: string }
        warehouseId: { type: string }
