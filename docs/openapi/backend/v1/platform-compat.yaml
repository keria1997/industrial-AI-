openapi: 3.0.3
info:
  title: Platform management compatibility contract
  version: '1.0.0'
  description: Aligns current platform client calls with PlatformController aggregates.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /platform/tenant:
    get:
      summary: Get tenant settings
      parameters: [{ $ref: '#/components/parameters/Tenant' }]
      responses: { '200': { description: Tenant settings } }
    put:
      summary: Update tenant settings
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: If-Match, in: header, required: true, schema: { type: integer } }
      responses: { '200': { description: Updated tenant } }
  /platform/permissions:
    get:
      summary: List the tenant permission catalog
      description: Canonical permission definitions; enterprise warehouses and factories are resources, not permissions.
      parameters: [{ $ref: '#/components/parameters/Tenant' }]
      responses: { '200': { description: Permission catalog entries } }
  /platform/permission-resources:
    get:
      summary: List enterprise authorization resources
      parameters: [{ $ref: '#/components/parameters/Tenant' }]
      responses: { '200': { description: Enterprise resource list } }
  /platform/role-grants:
    get:
      summary: List role grants
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - { name: roleId, in: query, schema: { type: string } }
      responses: { '200': { description: Grants for one role or all roles } }
  /platform/permission-adapters:
    get:
      summary: List permission adapters
      parameters: [{ $ref: '#/components/parameters/Tenant' }]
      responses: { '200': { description: Adapter list } }
  /platform/permission-adapters/{id}/sync:
    post:
      summary: Synchronize one permission adapter
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: integer } }
      responses: { '200': { description: Synced adapter } }
  /platform/audits:
    get:
      summary: Query audit logs
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Paged audit result with exact total and hasMore
          content:
            application/json:
              schema:
                type: object
                required: [items, total, hasMore, page, pageSize]
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer, minimum: 0 }
                  hasMore: { type: boolean }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1 }
  /platform/dictionaries:
    get:
      summary: List tenant dictionaries
      description: Supports dictionary-driven option lists. Categories such as equipment_type and equipment_health_status are user-managed data; the backend does not preset them.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [enabled, disabled] } }
      responses:
        '200':
          description: Dictionary items sorted by sortOrder, code and name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DictionaryItem' }
    post:
      summary: Create a tenant dictionary item
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryItem' }
      responses:
        '201': { description: Dictionary item created }
        '400': { description: Invalid dictionary fields }
        '409': { description: Category and code already exist in the tenant }
  /platform/capabilities/{code}:
    put:
      summary: Update capability status
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: integer } }
      responses: { '200': { description: Updated capability } }
  /platform/parameters/security:
    put:
      summary: Update security parameters
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { description: Effective security parameters } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Tenant: { name: X-Tenant-Id, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: X-Idempotency-Key, in: header, required: true, schema: { type: string } }
  schemas:
    DictionaryItem:
      type: object
      required: [category, code, name, status]
      properties:
        category: { type: string, maxLength: 100 }
        code: { type: string, maxLength: 50, pattern: '^[A-Za-z0-9_.-]+$' }
        name: { type: string, maxLength: 100 }
        status: { type: string, enum: [enabled, disabled] }
        sortOrder: { type: integer, minimum: 0, maximum: 9999, default: 0 }
