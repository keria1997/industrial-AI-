openapi: 3.0.3
info:
  title: ERP frontend remediation integration contract
  version: '2026-10-17'
  description: |
    Integration of existing client contracts, not backend acceptance.
    Existing client paths take precedence here. RMA and customer receipt reads use
    the verified fulfillment routes. Their write workflows, reversals and grant-version
    review remain blocked pending business-rule acceptance.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /fulfillment/rmas:
    get:
      summary: Read persisted RMA records within the authorized tenant
      description: |
        Requires sales.order.read. Read integration does not approve the create,
        inspection, restock or credit-note workflows. Missing amounts or currencies
        must not be inferred from quantities or the original order.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Persisted records; an empty items array with total=0 is a successful empty result
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RmaRead' }
                  total: { type: integer, minimum: 0 }
        '401': { description: Missing or expired session }
        '403': { description: Permission or tenant access denied; never display as an empty result }
        '5XX': { description: Read failed; clear the previous result and allow retry }
  /fulfillment/customer-receipts:
    get:
      summary: Read persisted customer receipt records within the authorized tenant
      description: |
        Requires sales.receipt.read. receiptStatus is the persisted canonical field;
        status is the current command response alias. When both exist but differ,
        show a status conflict instead of choosing one silently.
        Signing never changes the sales order completion state in the browser.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Persisted records, independent from order completion
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReceiptRead' }
                  total: { type: integer, minimum: 0 }
        '401': { description: Missing or expired session }
        '403': { description: Permission or tenant access denied; never display as an empty result }
        '5XX': { description: Read failed; clear the previous result and allow retry }
  /sales/ai-insights:
    get:
      summary: Read sales monitoring facts with explicit source availability
      description: |
        Source availability metadata is present in the current controller; aggregation
        semantics still require business acceptance, especially cross-month open orders.
        A timestamp with fixed zeros is not an EMPTY result. Count/amount facts require
        verified database aggregation; unavailable facts must be null, never fabricated zeros.
      parameters:
        - { name: X-Tenant-Id, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: Source status and authorized tenant facts; EMPTY means a verified empty scope
          content:
            application/json:
              schema:
                type: object
                required: [availability, dataAsOf, sourceVersion, currency, monthlyOrderCount, totalSalesAmount, stalledCount, deliveryRiskCount, deliveryRiskOrders, stalledOrders]
                properties:
                  availability: { type: string, enum: [AVAILABLE, EMPTY, UNAVAILABLE] }
                  dataAsOf: { type: string, format: date-time, nullable: true }
                  sourceVersion: { type: string, nullable: true }
                  currency: { type: string, pattern: '^[A-Z]{3}$', nullable: true }
                  monthlyOrderCount: { type: integer, minimum: 0, nullable: true }
                  totalSalesAmount: { type: string, nullable: true, description: Single-currency decimal amount; never sum currencies }
                  stalledCount: { type: integer, minimum: 0, nullable: true }
                  deliveryRiskCount: { type: integer, minimum: 0, nullable: true }
                  deliveryRiskOrders:
                    type: array
                    items:
                      type: object
                      required: [orderId]
                      properties:
                        orderId: { type: string }
                        customerName: { type: string }
                        deliveryDate: { type: string, format: date }
                        totalAmount: { type: string }
                  stalledOrders:
                    type: array
                    items:
                      type: object
                      required: [orderId]
                      properties:
                        orderId: { type: string }
        '401': { description: Missing or expired session }
        '403': { description: Sales monitoring or tenant scope access denied }
        '503': { description: Source unavailable; no fabricated statistics }
  /sales/sales-orders/{id}/cancel:
    post:
      summary: Cancel an authorized sales order with the user's reason
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200': { description: Authoritative sales order projection }
        '403': { description: Cancellation permission denied }
        '409': { description: Order state or version changed }
  /finance/payments:
    get:
      summary: Query payment records with server pagination and search
      responses:
        '200': { description: 'items[], total; payment has id, status, version, createdBy' }
    post:
      summary: Register a payment awaiting separate confirmation
      parameters:
        - $ref: '#/components/parameters/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, counterpartyId, counterpartyName, amount, currency, paymentMethod, paymentDate]
              properties:
                direction: { type: string, enum: [INBOUND, OUTBOUND] }
                receivableId: { type: string }
                payableId: { type: string }
                counterpartyId: { type: string }
                counterpartyName: { type: string }
                amount: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$' }
                currency: { type: string }
                paymentMethod: { type: string, enum: [bank_transfer, cash, check, offset, other] }
                paymentDate: { type: string, format: date }
                referenceNo: { type: string }
                remark: { type: string }
      responses:
        '200': { description: 'payment with id/status/version; registration does not imply allocation' }
        '409': { description: Version or idempotency conflict }
        '422': { description: Amount, currency or source validation rejected }
  /finance/payments/{id}/confirm:
    post:
      summary: Confirm payment under separation of duties
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Version'
      responses:
        '200': { description: 'payment and optional receivable/payable projection' }
        '403': { description: Permission or separation of duties rejected }
        '409': { description: State or version changed }
  /procurement/purchase-orders/{id}/receipts:
    post:
      summary: Register one delivery batch bounded by the remaining quantity
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CommandKey'
        - $ref: '#/components/parameters/Version'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [externalTransactionId, receivedAt, receivedQty, requireInspection]
              properties:
                externalTransactionId: { type: string, description: Unique delivery reference retained on retry }
                receivedAt: { type: string, format: date-time }
                receivedQty: { type: string }
                requireInspection: { type: boolean }
      responses:
        '200': { description: 'order, receipt, optional availability; never assume POSTED' }
        '409': { description: Over-receipt, concurrent modification or duplicate reference conflict }
  /procurement/purchase-receipts/{id}/inspect:
    post:
      summary: Submit the supported whole-batch inspection result
      description: Partial accepted/rejected quantities and evidence require an extended backend contract.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CommandKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [ACCEPTED, REJECTED] }
                remark: { type: string }
      responses:
        '200': { description: receipt with actual status }
  /procurement/purchase-returns:
    get:
      summary: Query authorized purchase returns
      responses:
        '200': { description: 'items[], total' }
    post:
      summary: Register a return against a purchase receipt
      parameters:
        - $ref: '#/components/parameters/CommandKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [purchaseReceiptId, returnQty, reason]
              properties:
                purchaseReceiptId: { type: string }
                returnQty: { type: string }
                reason: { type: string }
                remark: { type: string }
      responses:
        '200': { description: PurchaseReturnDto; approval is not simulated }
  /workbench/dashboard:
    get:
      summary: Read workbench sections independently
      parameters:
        - { name: role, in: query, schema: { type: string }, description: Display role from the signed session; never grants access }
        - { name: sections, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 50 } }
        - { name: eventScope, in: query, schema: { type: string, enum: [KEY, ALL] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: todoLimit, in: query, schema: { type: integer, default: 5, maximum: 50 } }
        - { name: activityLimit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        '200': { description: Requested sections and generation timestamps; missing fields stay unavailable }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Tenant: { name: X-Tenant-Id, in: header, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    CommandKey: { name: X-Idempotency-Key, in: header, required: true, schema: { type: string } }
    Version: { name: If-Match, in: header, required: true, schema: { type: string } }
  schemas:
    RmaRead:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1 }
        rmaNo: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        orderNo: { type: string, nullable: true }
        productName: { type: string, nullable: true }
        requestedQty: { type: string, nullable: true }
        approvedQty: { type: string, nullable: true }
        receivedQty: { type: string, nullable: true }
        qualifiedQty: { type: string, nullable: true }
        status: { type: string, nullable: true }
        creditArId: { type: string, nullable: true }
        creditArAmount: { type: string, nullable: true, description: Decimal amount; display requires an explicit currency }
        currency: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        version: { type: integer, minimum: 1, nullable: true }
    ReceiptRead:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1 }
        receiptNo: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        orderNo: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        signedQty: { type: string, nullable: true }
        rejectedQty: { type: string, nullable: true }
        damagedQty: { type: string, nullable: true }
        receiptStatus: { type: string, nullable: true }
        status: { type: string, nullable: true }
        signedAt: { type: string, nullable: true }
        version: { type: integer, minimum: 1, nullable: true }
