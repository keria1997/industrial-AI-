# 业务后端配置
# 禁止硬编码密钥，通过环境变量注入

server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiapp}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# AI 服务地址（业务后端 -> AI 服务）
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-hours: 8

